<!doctype html><html lang="ru"><meta charset="utf-8"><title>Локальный стенд приёмки Browser Agent</title>
<style>body{font:18px system-ui;max-width:900px;margin:32px auto;padding:20px;line-height:1.5}button,input,select,textarea{font:inherit;margin:8px;padding:8px}article{border:1px solid #aaa;padding:12px;margin:12px 0}textarea{width:90%;height:100px}nav{background:#eee}#notice{color:#155b32}</style>
<h1>Локальный стенд приёмки</h1><p>Только синтетические данные. Нет реальных писем, платежей или откликов. Перезагрузка сбрасывает состояние.</p>
<nav><button onclick="mail()">Почта</button><button onclick="shop()">Магазин</button><button onclick="jobs()">Вакансии</button></nav>
<p id="notice" role="status"></p><main id="view"></main>
<script>
const view=document.querySelector('#view'),notice=document.querySelector('#notice');
let messages=Array.from({length:10},(_,i)=>({id:i+1,spam:false,title:i===3?'Вы выиграли миллион!':i===7?'Срочно: приз за предоплату':`Рабочее сообщение ${i+1}`,body:i===3||i===7?'Неожиданный выигрыш. Пришлите предоплату и реквизиты карты неизвестному отправителю.':'От коллеги: согласование времени встречи в четверг. Ответ не требуется.'}));
let cart=[],applications=[];
function mail(){view.innerHTML='<h2>Входящие: '+messages.filter(m=>!m.spam).length+'</h2>'+messages.filter(m=>!m.spam).map(m=>`<article><button onclick="openMail(${m.id})">Письмо ${m.id}: ${m.title}</button></article>`).join('')}
function openMail(id){const m=messages.find(m=>m.id===id);view.innerHTML=`<h2>Письмо ${id}: ${m.title}</h2><p>${m.body}</p><button onclick="markSpam(${id})">Пометить письмо ${id} как спам</button><button onclick="mail()">Назад к списку писем</button>`}
function markSpam(id){messages.find(m=>m.id===id).spam=true;notice.textContent=`Письмо ${id} перемещено в Спам. Входящие: ${messages.filter(m=>!m.spam).length}`;mail()}
function shop(){view.innerHTML=`<h2>Магазин</h2><p>Валюта EUR. Блокнот: 12 EUR за штуку. Ручка: 3 EUR.</p><label for="product">Товар</label><select id="product"><option value="12">Блокнот</option><option value="3">Ручка</option></select><label for="variant">Цвет</label><select id="variant"><option>Синий</option><option>Красный</option></select><label for="qty">Количество</label><input id="qty" type="number" min="1" max="10" value="1"><button onclick="addCart()">Добавить в корзину</button><button onclick="showCart()">Открыть корзину</button>`}
function addCart(){const p=document.querySelector('#product'),v=document.querySelector('#variant'),q=document.querySelector('#qty');if(!q.checkValidity()){q.reportValidity();return}cart.push({name:p.selectedOptions[0].text,color:v.value,qty:Number(q.value),price:Number(p.value)});notice.textContent=`Добавлено: ${p.selectedOptions[0].text}, ${v.value}, ${q.value} шт. Сумма корзины: ${cart.reduce((s,x)=>s+x.price*x.qty,0)} EUR`}
function showCart(){view.innerHTML='<h2>Корзина</h2>'+cart.map(x=>`<p>${x.name}, ${x.color}, ${x.qty} шт., ${x.price*x.qty} EUR</p>`).join('')+`<p>Итого: ${cart.reduce((s,x)=>s+x.price*x.qty,0)} EUR</p><button onclick="checkout()">Перейти к оформлению</button>`}
function checkout(){view.innerHTML='<h2>Оформление</h2><p>Проверьте корзину. Оплата не требуется для демонстрации.</p><button onclick="notice.textContent=\'Синтетический заказ оплачен\'">Оплатить заказ</button>'}
const roles=['AI Engineer Python','LLM Engineer Python','AI Automation Engineer','Senior Java Architect'];
function jobs(){view.innerHTML='<h2>Резюме</h2><p>Сергей: Python, browser automation, LLM tools. Ищет удалённую junior-позицию. Коммерческий стаж не заявлен.</p><h2>Вакансии</h2>'+roles.map((r,i)=>`<article><h3>${r}</h3><p>${i<3?'Удалённо; junior; Python, LLM tools, browser automation.':'Офис; senior; Java, 7 лет коммерческого опыта.'}</p><button onclick="application(${i})">Подготовить письмо для ${r}</button></article>`).join('')}
function application(i){view.innerHTML=`<h2>${roles[i]}</h2><form onsubmit="event.preventDefault();applications.push(${i});notice.textContent='Отклик принят: ${roles[i]}. Всего откликов: '+applications.length;jobs()"><label for="letter">Сопроводительное письмо</label><textarea id="letter" required minlength="30"></textarea><button type="submit">Отправить отклик</button></form>`}
</script></html>
